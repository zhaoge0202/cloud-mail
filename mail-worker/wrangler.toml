name = "zg-wy-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

# 绑定必须以本文件为准，否则每次 deploy 会冲掉 Dashboard 手工绑定
# D1 / KV 请到 Dashboard 复制 ID 后填入（资源名已按你当前绑定写好）
[[d1_databases]]
binding = "db"
database_name = "zhaogemail-sky-d1"
database_id = "43d54980-d5b5-4d05-9239-d498bdb6b7ea"		# zhaogemail-sky-d1

[[kv_namespaces]]
binding = "kv"
id = "7d2618bb226c4e6bb208976e0f5e670d"			# zhaogemail-sky

[[r2_buckets]]
binding = "r2"
bucket_name = "zg-test-chengdu"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
# 每日任务 UTC 16:00；半小时刷新分析页缓存
crons = ["0 16 * * *"]

[vars]
#orm_log = false
#domain = []				# 邮件域名可配置多个 示例: ["example1.com","example2.com"]
#admin = admin@example.com				# 管理员邮箱 单个/多个逗号分隔
#jwt_secret = ""			# jwt 密钥，建议用 wrangler secret put jwt_secret

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
